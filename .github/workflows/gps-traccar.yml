name: GPS Traccar tests (mocked)

on:
  pull_request:
    paths:
      - '.github/workflows/gps-traccar.yml'
      - 'supabase/config.toml'
      - 'supabase/functions/gps-traccar/**'
      - 'supabase/testit/gps-traccar.test.mjs'
      - 'supabase/testit/gps-traccar-data.test.mjs'
      - 'testit/test_gps_traccar.py'
      - 'testit/test_gps_data.py'

permissions:
  contents: read

jobs:
  gps-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - run: python -m pytest -q --noconftest testit/test_gps_traccar.py testit/test_gps_data.py

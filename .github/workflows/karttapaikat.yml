name: Kartan paikat (OpenStreetMap)

# Hakee kerran kuussa Suomen huoltoasemat, korjaamot ja latauspisteet OpenStreetMapista (Overpass API) ja avaa
# muutoksista PR:n tarkistettavaksi. Mitään ei julkaista ilman PR:n yhdistämistä. Aineisto: © OpenStreetMap-tekijät, ODbL.
# Käsin: Actions → Kartan paikat (OpenStreetMap) → Run workflow.

on:
  schedule:
    - cron: '17 3 2 * *'  # kuun 2. päivä klo 3.17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: karttapaikat
  cancel-in-progress: false

jobs:
  paivita:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Hae ja rakenna aineisto
        run: python tyokalut/karttapaikat.py
      - name: Avaa PR muutoksista
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- kartta-data)" ]; then echo "Ei muutoksia."; exit 0; fi
          paiva="$(date -u +%Y-%m-%d)"
          haara="data/karttapaikat-$paiva"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$haara"
          git add kartta-data
          git commit -m "Kartan paikat: OpenStreetMap $paiva"
          git push origin "$haara"
          gh pr create --base main --head "$haara" \
            --title "Kartan paikat: OpenStreetMap $paiva" \
            --body "Kuukausittainen päivitys: Suomen huoltoasemat, korjaamot ja latauspisteet OpenStreetMapista (© OpenStreetMap-tekijät, ODbL). Tarkista määrät ja muutosten koko ennen yhdistämistä." \
          || echo "::warning::PR:n avaus estetty. Salli Settings → Actions → General → Allow GitHub Actions to create and approve pull requests, tai avaa PR haarasta $haara käsin."
